name: Release Please

on:
  push:
    branches: [main]

# Read-only by default; jobs that publish release assets escalate below.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.rp.outputs['cli--release_created'] }}
      cli_tag_name: ${{ steps.rp.outputs['cli--tag_name'] }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}

  build-cli:
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            os: linux
            arch: x86_64
            target: bun-linux-x64
          - runs-on: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: bun-linux-arm64
          - runs-on: macos-latest
            os: darwin
            arch: aarch64
            target: bun-darwin-arm64
          - runs-on: macos-15-intel
            os: darwin
            arch: x86_64
            target: bun-darwin-x64

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            src/index.tsx \
            --outfile dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }}

      # Bun's darwin output can carry a malformed (1.3.12, arm64) or stale (1.4.4,
      # x64) signature; Apple Silicon SIGKILLs such binaries on launch (#321).
      # Re-sign ad hoc and refuse to publish anything that doesn't verify.
      - name: Sign and verify macOS binary
        if: matrix.os == 'darwin'
        run: |
          codesign --force --sign - dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }}
          codesign --verify --strict --verbose=2 dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }}

      # Every runner matches its target arch, so the binary must start here.
      - name: Smoke-test binary
        run: dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }} --version

      - name: Upload binary to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-please.outputs.cli_tag_name }}
          files: cli/dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devlair-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/devlair-cli-${{ matrix.os }}-${{ matrix.arch }}

  package-cli-modules:
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Package modules
        # -C cli so the archive root stays "modules/" (matches install.sh's
        # extract layout: STAGE_DIR/modules → /usr/local/share/devlair/modules).
        run: tar -czf modules.tar.gz -C cli modules

      - name: Upload tarball to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-please.outputs.cli_tag_name }}
          files: modules.tar.gz

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modules-tarball
          path: modules.tar.gz

  checksums-cli:
    needs: [release-please, build-cli, package-cli-modules]
    if: needs.release-please.outputs.cli_release_created == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: devlair-cli-*
          merge-multiple: true

      - name: Download modules tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          name: modules-tarball

      - name: Generate checksums
        run: |
          cd assets
          sha256sum devlair-cli-* modules.tar.gz | tee checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-please.outputs.cli_tag_name }}
          files: assets/checksums.txt
