name: CI (v2)

on:
  push:
    branches: ["main"]
    paths:
      - "cli/**"
      - ".github/workflows/ci-v2.yml"
  # No path filter on pull_request: lint and test are required checks on main,
  # and a filtered-out run leaves them "expected" forever, blocking the PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check (lint + format)
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  # TEMP probe: which Bun versions emit a launchable darwin-arm64 binary.
  compile-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.2.17', '1.3.12', '1.3.14', '1.4.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: Compile and probe
        run: |
          bun build --compile --target=bun-darwin-arm64 src/index.tsx --outfile dist/devlair
          codesign -dv dist/devlair 2>&1 || true
          codesign --verify --strict --verbose=2 dist/devlair && echo SIG_OK || echo SIG_BAD
          dist/devlair --version && echo LAUNCH_OK
