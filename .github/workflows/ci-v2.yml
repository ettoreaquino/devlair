name: CI (v2)

on:
  push:
    branches: ["main"]
    paths:
      - "cli/**"
      - ".github/workflows/ci-v2.yml"
  # No path filter on pull_request: lint and test are required checks on main,
  # and a filtered-out run leaves them "expected" forever, blocking the PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check (lint + format)
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  # Runs the release's compile -> ad-hoc sign -> strict verify recipe for both
  # macOS targets, so a Bun bump whose output can't be signed (#321, #325) fails
  # here, not in the release. Launching is not a check: runners start binaries
  # that a normal Mac SIGKILLs.
  compile-macos:
    strategy:
      matrix:
        include:
          - runs-on: macos-latest
            target: bun-darwin-arm64
          - runs-on: macos-15-intel
            target: bun-darwin-x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile, sign and verify
        run: |
          bun build --compile --target=${{ matrix.target }} src/index.tsx --outfile dist/devlair
          codesign --force --sign - dist/devlair
          codesign --verify --strict --verbose=2 dist/devlair
